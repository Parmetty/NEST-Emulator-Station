name: build-swanstation

# Builds the SwanStation libretro core on a hosted Windows runner with the
# preinstalled Visual Studio 2022 + CMake toolchain. No local build environment
# is needed. The DLL is committed to the `ci/swanstation-artifact` branch so it
# can be fetched without an Actions artifact token.

on:
  push:
    branches:
      - ci/swanstation-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nest
        uses: actions/checkout@v4

      - name: Checkout SwanStation source
        uses: actions/checkout@v4
        with:
          repository: libretro/swanstation
          path: swanstation
          fetch-depth: 1

      - name: Configure (MSVC x64)
        shell: pwsh
        run: |
          cmake -S swanstation -B swanstation/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build libretro core
        shell: pwsh
        run: |
          cmake --build swanstation/build --config Release --target swanstation_libretro --parallel
          Get-ChildItem swanstation/build -Recurse -Filter swanstation_libretro.dll | Select-Object FullName, Length

      - name: Stage DLL in the Nest tree
        shell: pwsh
        run: |
          $dll = Get-ChildItem swanstation/build -Recurse -Filter swanstation_libretro.dll | Select-Object -First 1
          if (-not $dll) { throw 'swanstation_libretro.dll was not produced' }
          New-Item -ItemType Directory -Force -Path resources/engines/swanstation | Out-Null
          Copy-Item $dll.FullName resources/engines/swanstation/swanstation_libretro.dll -Force
          Get-Item resources/engines/swanstation/swanstation_libretro.dll | Select-Object Length, LastWriteTime

      - name: Publish DLL to artifact branch
        shell: bash
        run: |
          git config user.name "nest-ci"
          git config user.email "nest-ci@users.noreply.github.com"
          git add resources/engines/swanstation/swanstation_libretro.dll
          git commit -m "ci: SwanStation core build (${GITHUB_SHA})" || true
          git push --force origin HEAD:ci/swanstation-artifact
